[package]
name = "armillae-llm"
version = "0.1.0-alpha.0"
edition.workspace = true
description = "Runtime-independent LLM Bridge contracts, configuration, and mocks for Armillae"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/armillae-llm"
readme.workspace = true
keywords = ["llm", "bridge", "provider", "agent", "ai"]
categories = ["development-tools", "asynchronous"]

[features]
mock = []

[dependencies]
armillae-core = { version = "0.1.0-alpha.0", path = "../armillae-core" }
futures-util = "0.3"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.1.4"
url = { version = "2", features = ["serde"] }

[dev-dependencies]
futures-executor = "0.3"
