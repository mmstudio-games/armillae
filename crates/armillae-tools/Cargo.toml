[package]
name = "armillae-tools"
version = "0.1.0-alpha.0"
edition.workspace = true
description = "Type-safe Tool authoring, registration, and single-call execution for Armillae"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/armillae-tools"
readme.workspace = true
keywords = ["llm", "tools", "tool-calling", "agent", "ai"]
categories = ["development-tools"]

[dependencies]
armillae-core = { version = "0.1.0-alpha.0", path = "../armillae-core" }
futures-util = "0.3"
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
futures-executor = "0.3"
