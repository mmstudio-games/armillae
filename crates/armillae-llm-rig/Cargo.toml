[package]
name = "armillae-llm-rig"
version = "0.1.0-alpha.1"
edition.workspace = true
description = "Rig-backed LLM Provider adapters for Armillae"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/armillae-llm-rig"
readme.workspace = true
keywords = ["llm", "rig", "provider", "tool-calling", "ai"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
armillae-core = { version = "0.1.0-alpha.1", path = "../armillae-core" }
armillae-llm = { version = "0.1.0-alpha.1", path = "../armillae-llm" }
futures-util = "0.3.34"
rig-core = "=0.41.0"
secrecy = "0.10"
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
armillae-context = { path = "../armillae-context" }
armillae-llm = { path = "../armillae-llm", features = ["mock"] }
armillae-tools = { path = "../armillae-tools" }
futures = "0.3"
rig-core = { version = "=0.41.0", features = ["test-utils"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing-subscriber = "0.3"
