[package]
name = "armillae-llm-rig"
version.workspace = true
edition.workspace = true

[dependencies]
armillae-core = { version = "0.1.0", path = "../armillae-core" }
armillae-llm = { version = "0.1.0", path = "../armillae-llm" }
rig-core = "=0.41.0"
secrecy = "0.10"
serde_json = "1"

[dev-dependencies]
armillae-llm = { path = "../armillae-llm", features = ["mock"] }
futures = "0.3"
rig-core = { version = "=0.41.0", features = ["test-utils"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
