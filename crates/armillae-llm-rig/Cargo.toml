[package]
name = "armillae-llm-rig"
version.workspace = true
edition.workspace = true

[dependencies]
armillae-core = { version = "0.1.0", path = "../armillae-core" }
armillae-llm = { version = "0.1.0", path = "../armillae-llm" }
rig-core = "=0.41.0"

[dev-dependencies]
futures = "0.3"
rig-core = { version = "=0.41.0", features = ["test-utils"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
